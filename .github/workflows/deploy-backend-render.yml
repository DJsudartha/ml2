name: Deploy Docker backend to Render (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deploy:
    # Intentionally inert until the Docker runtime is approved and configured.
    if: vars.RENDER_DOCKER_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: render-production
    steps:
      - name: Verify current main has passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          current="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          passing="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&branch=main&per_page=30" \
            --jq ".workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\") | .id")"
          test -n "$passing"

      - name: Trigger exact-commit Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}" > /dev/null
          echo "Render deploy triggered for tested commit ${GITHUB_SHA}. Verify its result and smoke the live API before considering release complete."
