name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Python launcher tests
        run: node --test ../scripts/run-python-module.test.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Deployment URL guard
        run: npm run test:deploy

      - name: Test
        run: npm run test

      - name: Production build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:deploy

  backend:
    name: backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Backend tests (including focused draft API tests)
        run: python -m pytest -q

      - name: Lint
        run: ruff check backend tests .github/scripts

  docker:
    name: docker
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python for smoke test
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ml2-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container under Render Free memory limit
        run: docker run --detach --name ml2-ci --memory=512m --publish 127.0.0.1:10000:10000 --env PORT=10000 ml2-backend:ci

      - name: Wait for health and smoke real API
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:10000/health > /dev/null; then
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx ml2-ci; then
              docker logs ml2-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:10000/health > /dev/null
          python .github/scripts/smoke_backend.py http://127.0.0.1:10000
          docker image inspect ml2-backend:ci --format 'Image bytes: {{.Size}}'
          docker stats ml2-ci --no-stream --format 'Container memory: {{.MemUsage}}'

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs ml2-ci || true
          docker rm --force ml2-ci || true
